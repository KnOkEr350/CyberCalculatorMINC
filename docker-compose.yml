services:
  db:
    build:
      context: ./postgres
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-cybercalc}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-cybercalc}
      POSTGRES_DB: ${DB_NAME:-cybercalc}
    networks: [database]
    mem_limit: 1g
    pids_limit: 256
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-cybercalc} -d ${DB_NAME:-cybercalc}"]
      interval: 5s
      timeout: 5s
      retries: 10
    # Порт наружу не пробрасывается намеренно — доступ к БД только из docker-сети.
    # Для локальной отладки можно временно раскомментировать:
    # ports:
    #   - "5432:5432"

  uploads-init:
    image: alpine:3.24.1@sha256:28bd5fe8b56d1bd048e5babf5b10710ebe0bae67db86916198a6eec434943f8b
    user: "0:0"
    command: ["sh", "-c", "mkdir -p /data/uploads && chown 65532:65532 /data/uploads"]
    restart: "no"
    volumes:
      - uploads_data:/data/uploads

  migrate:
    build:
      context: .
      dockerfile: backend/Dockerfile
    command: [migrate]
    restart: "no"
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_HOST: db
      DB_USER: ${DB_USER:-cybercalc}
      DB_PASSWORD: ${DB_PASSWORD:-cybercalc}
      DB_NAME: ${DB_NAME:-cybercalc}
      ADMIN_BOOTSTRAP_EMAIL: ${ADMIN_BOOTSTRAP_EMAIL:-admin@minc.local}
      ADMIN_BOOTSTRAP_PASSWORD: ${ADMIN_BOOTSTRAP_PASSWORD:-ChangeMe123!}
      RUNTIME_DB_USER: ${DB_RUNTIME_USER:-cybercalc_app}
      RUNTIME_DB_PASSWORD: ${DB_RUNTIME_PASSWORD:-local-only-runtime-password}
    healthcheck:
      disable: true
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    networks: [database]
    mem_limit: 256m
    pids_limit: 64

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      uploads-init:
        condition: service_completed_successfully
      migrate:
        condition: service_completed_successfully
    environment:
      DB_HOST: db
      DB_PORT: "5432"
      DB_USER: ${DB_RUNTIME_USER:-cybercalc_app}
      DB_PASSWORD: ${DB_RUNTIME_PASSWORD:-local-only-runtime-password}
      RUN_MIGRATIONS: "false"
      DB_NAME: ${DB_NAME:-cybercalc}
      DB_SSLMODE: disable
      HTTP_ADDR: ":8080"
      UPLOAD_DIR: /data/uploads
      ADMIN_BOOTSTRAP_EMAIL: ${ADMIN_BOOTSTRAP_EMAIL:-admin@minc.local}
      ADMIN_BOOTSTRAP_PASSWORD: ${ADMIN_BOOTSTRAP_PASSWORD:-ChangeMe123!}
      APP_ENV: ${APP_ENV:-development}
      PUBLIC_URL: ${PUBLIC_URL:-}
      SESSION_TTL_HOURS: ${SESSION_TTL_HOURS:-12}
      CLAMAV_ADDRESS: ${CLAMAV_ADDRESS:-}
      UPLOAD_QUOTA_BYTES: ${UPLOAD_QUOTA_BYTES:-1073741824}
      MFA_ENCRYPTION_KEY: ${MFA_ENCRYPTION_KEY:-}
    read_only: true
    tmpfs:
      - /tmp:size=128m,mode=1777
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 768m
    pids_limit: 128
    stop_grace_period: 110s
    networks: [application, database]
    volumes:
      - uploads_data:/data/uploads
    deploy:
      replicas: ${BACKEND_REPLICAS:-2}

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        APP_VERSION: ${APP_VERSION:-dev}
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
      - /var/cache/nginx:size=32m,uid=101,gid=101
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 128m
    pids_limit: 64
    networks: [application]

  nginx:
    build:
      context: ./nginx
      dockerfile: Dockerfile
    user: "101:101"
    restart: unless-stopped
    depends_on:
      - backend
      - frontend
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    ports:
      - "${HTTP_BIND:-127.0.0.1}:${HTTP_PORT:-8080}:80"
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
      - /var/cache/nginx:size=256m,uid=101,gid=101
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 384m
    pids_limit: 64
    networks: [application]
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/api/health"]
      interval: 15s
      timeout: 5s
      retries: 5

networks:
  application:
  database:
    internal: true

volumes:
  db_data:
  uploads_data:
