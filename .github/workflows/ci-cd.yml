name: CI/CD

on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * 1"

permissions:
  contents: read

env:
  GO_VERSION_FILE: backend/go.mod
  TRIVY_VERSION: v0.74.0

jobs:
  quality:
    name: Formatting and linters
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: ${{ env.GO_VERSION_FILE }}
          cache-dependency-path: |
            backend/go.sum
            tests/go.sum

      - name: Check Go formatting
        shell: bash
        run: |
          unformatted="$(gofmt -l backend tests)"
          if [[ -n "$unformatted" ]]; then
            echo "These files must be formatted with gofmt:"
            echo "$unformatted"
            exit 1
          fi

      - name: Vet backend
        working-directory: backend
        run: go vet ./...

      - name: Vet external tests
        working-directory: tests
        run: go vet ./...

      - name: Staticcheck backend
        working-directory: backend
        run: go run honnef.co/go/tools/cmd/staticcheck@v0.8.1 ./...

      - name: Staticcheck external tests
        working-directory: tests
        run: go run honnef.co/go/tools/cmd/staticcheck@v0.8.1 ./...

      - name: Lint GitHub Actions workflow
        run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.12

      - name: Lint extracted shell scripts
        run: shellcheck scripts/run-zap.sh scripts/verify-deployment.sh scripts/verify.sh

  backend:
    name: Module / backend
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: ${{ env.GO_VERSION_FILE }}
          cache-dependency-path: backend/go.sum

      - name: Run backend unit tests with race detector
        working-directory: backend
        run: go test -count=1 -race -covermode=atomic -coverprofile=backend-coverage.out ./...

      - name: Upload backend coverage
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: backend-coverage
          path: backend/backend-coverage.out
          if-no-files-found: warn
          retention-days: 14

  frontend:
    name: Module / frontend
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Check syntax and run frontend tests
        run: node frontend/check.mjs

  migrations:
    name: Module / migrations
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16-alpine@sha256:cf78e76683b9ca8c5733cbbdce6c9262b45b6767934dd0a95e671f9a0fc20685
        env:
          POSTGRES_USER: workspace_test
          POSTGRES_PASSWORD: workspace_test
          POSTGRES_DB: workspace_migration_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U workspace_test -d workspace_migration_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12

    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: ${{ env.GO_VERSION_FILE }}
          cache-dependency-path: backend/go.sum

      - name: Verify immutable SQL migrations
        working-directory: backend
        run: go run ./cmd/migrationcheck ../migrations ../migrations/checksums.sha256

      - name: Verify upgrade from the legacy schema
        working-directory: backend
        env:
          TEST_MIGRATION_DATABASE_DSN: host=127.0.0.1 port=5432 user=workspace_test password=workspace_test dbname=workspace_migration_test sslmode=disable
          TEST_MIGRATIONS_DIR: ${{ github.workspace }}/migrations
        run: go test -count=1 -race -run '^TestWorkspaceMigrationPreservesLegacyData$' ./internal/dbx

  contract:
    name: Module / contract
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: ${{ env.GO_VERSION_FILE }}
          cache-dependency-path: backend/go.sum

      - name: Verify versioned API contract
        working-directory: backend
        run: go run ./cmd/apicontract ../api/openapi/v1.json ./internal/modules

      - name: Run API contract regression tests
        working-directory: backend
        run: go test -count=1 ./internal/apicontract

  golden:
    name: Module / golden
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: ${{ env.GO_VERSION_FILE }}
          cache-dependency-path: backend/go.sum

      - name: Compare generated reports with golden files
        working-directory: backend
        run: go test -count=1 -run Golden ./internal/xlsx

  e2e:
    name: Module / e2e
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16-alpine@sha256:cf78e76683b9ca8c5733cbbdce6c9262b45b6767934dd0a95e671f9a0fc20685
        env:
          POSTGRES_USER: workspace_test
          POSTGRES_PASSWORD: workspace_test
          POSTGRES_DB: workspace_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U workspace_test -d workspace_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12

    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: ${{ env.GO_VERSION_FILE }}
          cache-dependency-path: |
            backend/go.sum
            tests/go.sum

      - name: Run API scenarios against PostgreSQL
        working-directory: tests
        env:
          TEST_DATABASE_DSN: host=127.0.0.1 port=5432 user=workspace_test password=workspace_test dbname=workspace_test sslmode=disable
          TEST_MIGRATIONS_DIR: ${{ github.workspace }}/migrations
        run: go test -count=1 -race -coverpkg=cybercalc/... -covermode=atomic -coverprofile=e2e-coverage.out ./...

      - name: Upload e2e coverage
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: e2e-coverage
          path: tests/e2e-coverage.out
          if-no-files-found: warn
          retention-days: 14

  dynamic:
    name: Fuzzing and performance profiles
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: ${{ env.GO_VERSION_FILE }}
          cache-dependency-path: |
            backend/go.sum
            tests/go.sum

      - name: Fuzz untrusted XLSX input
        working-directory: tests
        run: go test -run '^$' -fuzz '^FuzzWorkbookReader$' -fuzztime 20s ./...

      - name: Record calculator CPU and memory profiles
        working-directory: tests
        run: |
          go test -run '^$' -bench '^BenchmarkCalculateAmount$' -benchmem \
            -cpuprofile perf-cpu.pprof -memprofile perf-memory.pprof ./...
          go tool pprof -top perf-cpu.pprof > perf-cpu.txt
          go tool pprof -top perf-memory.pprof > perf-memory.txt

      - name: Upload performance profiles
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: performance-profiles
          path: |
            tests/perf-*.pprof
            tests/perf-*.txt
          retention-days: 14

  codeql:
    name: CodeQL (${{ matrix.language }})
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: read
      security-events: write
      packages: read
    strategy:
      fail-fast: false
      matrix:
        language:
          - go
          - javascript-typescript

    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Set up Go
        if: matrix.language == 'go'
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: ${{ env.GO_VERSION_FILE }}
          cache-dependency-path: backend/go.sum

      - name: Initialize CodeQL
        uses: github/codeql-action/init@311b4ee155dcdab395044f00946f664bd51ff173 # v4.38.0
        with:
          languages: ${{ matrix.language }}
          queries: security-extended

      - name: Build Go application for CodeQL
        if: matrix.language == 'go'
        working-directory: backend
        run: go build ./cmd/server

      - name: Analyze with CodeQL
        uses: github/codeql-action/analyze@311b4ee155dcdab395044f00946f664bd51ff173 # v4.38.0
        with:
          category: /language:${{ matrix.language }}

  semgrep:
    name: Semgrep SAST
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      security-events: write

    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Scan Go, JavaScript and OWASP patterns
        run: |
          mkdir -p security-artifacts
          docker run --rm \
            --volume "$PWD:/src" \
            --workdir /src \
            semgrep/semgrep:1.177.0@sha256:acaac22ffc7b7cc5926de0751b223bce0b2491c33d18422fa72f632c78d81198 \
            semgrep scan --error --metrics=off --severity ERROR \
            --config p/default --config p/owasp-top-ten \
            --sarif --output security-artifacts/semgrep.sarif .

      - name: Upload Semgrep results to code scanning
        if: >-
          always() && hashFiles('security-artifacts/semgrep.sarif') != '' &&
          (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
        uses: github/codeql-action/upload-sarif@311b4ee155dcdab395044f00946f664bd51ff173 # v4.38.0
        with:
          sarif_file: security-artifacts/semgrep.sarif
          category: semgrep

      - name: Upload Semgrep report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: semgrep-report
          path: security-artifacts/semgrep.sarif
          if-no-files-found: warn
          retention-days: 14

  supply-chain:
    name: Secrets, dependencies and SBOM
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: ${{ env.GO_VERSION_FILE }}
          cache-dependency-path: |
            backend/go.sum
            tests/go.sum

      - name: Scan repository, secrets and Docker configuration
        uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret,misconfig
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
          format: table

      - name: Check Go dependencies with govulncheck
        shell: bash
        run: |
          (cd backend && go run golang.org/x/vuln/cmd/govulncheck@v1.7.0 ./...)
          (cd tests && go run golang.org/x/vuln/cmd/govulncheck@v1.7.0 ./...)

      - name: Generate CycloneDX SBOM for the shipped backend
        working-directory: backend
        env:
          CGO_ENABLED: "0"
          GOOS: linux
          GOARCH: amd64
        run: |
          mkdir -p ../security-artifacts
          go run github.com/CycloneDX/cyclonedx-gomod/cmd/cyclonedx-gomod@v1.10.0 \
            app -json -licenses -main cmd/server \
            -output ../security-artifacts/cybercalculator-backend.cdx.json .

      - name: Upload dependency reports and SBOM
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: dependency-security-reports
          path: security-artifacts
          if-no-files-found: warn
          retention-days: 30

  dependency-track:
    name: Upload SBOM to Dependency-Track
    needs: supply-chain
    if: >-
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' ||
       github.event_name == 'workflow_dispatch' ||
       github.event_name == 'schedule')
    runs-on: [self-hosted, linux, x64, dependency-track]
    timeout-minutes: 10
    env:
      DTRACK_HOSTNAME: ${{ vars.DTRACK_HOSTNAME }}
      DTRACK_API_KEY: ${{ secrets.DTRACK_API_KEY }}

    steps:
      - name: Download generated SBOM
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: dependency-security-reports
          path: security-artifacts

      - name: Upload SBOM to OWASP Dependency-Track
        if: env.DTRACK_HOSTNAME != '' && env.DTRACK_API_KEY != ''
        uses: DependencyTrack/gh-upload-sbom@d8935b70f527d6aca6bbef5ab02db3933c9a8626 # v4.2.0
        with:
          server-hostname: ${{ env.DTRACK_HOSTNAME }}
          protocol: ${{ vars.DTRACK_PROTOCOL || 'http' }}
          port: ${{ vars.DTRACK_PORT || '8080' }}
          api-key: ${{ env.DTRACK_API_KEY }}
          project-name: CyberCalculatorMINC
          project-version: ${{ github.sha }}
          project-tags: ci,go
          auto-create: true
          is-latest: true
          bom-filename: security-artifacts/cybercalculator-backend.cdx.json

      - name: Report missing Dependency-Track connection
        if: env.DTRACK_HOSTNAME == '' || env.DTRACK_API_KEY == ''
        run: echo "::warning::Dependency-Track upload is disabled; configure DTRACK_HOSTNAME and DTRACK_API_KEY"

  container-dast:
    name: Isolated containers and OWASP ZAP
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    needs: e2e
    env:
      COMPOSE_PROJECT_NAME: cybercalc-ci-${{ github.run_id }}-${{ github.run_attempt }}
      CI_HTTP_PORT: "18080"
      APP_VERSION: ${{ github.sha }}

    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Set up Go for Compose smoke tests
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: ${{ env.GO_VERSION_FILE }}
          cache-dependency-path: |
            backend/go.sum
            tests/go.sum

      - name: Create isolated CI configuration
        shell: bash
        run: |
          umask 077
          {
            echo "DB_USER=cybercalc_ci"
            echo "DB_PASSWORD=ci-only-password"
            echo "DB_NAME=cybercalc_ci"
            echo "HTTP_PORT=${CI_HTTP_PORT}"
            echo "BACKEND_REPLICAS=2"
            echo "ADMIN_BOOTSTRAP_EMAIL=ci-admin@example.invalid"
            echo "ADMIN_BOOTSTRAP_PASSWORD=ci-only-admin-password"
            echo "BACKEND_FEATURE_FLAGS=all"
            echo "FRONTEND_FEATURE_FLAGS=all"
          } > .env

      - name: Validate Compose configuration
        run: docker compose config --quiet

      - name: Build and start the complete application
        run: docker compose up --detach --build --wait --wait-timeout 180

      - name: Verify isolated application boundary
        working-directory: tests
        shell: bash
        env:
          COMPOSE_SMOKE_URL: http://127.0.0.1:${{ env.CI_HTTP_PORT }}
        run: |
          mkdir -p ../security-artifacts
          go test -count=1 -v -timeout 3m -run '^TestComposeBoundary$' . 2>&1 | tee ../security-artifacts/compose-boundary.log

      - name: Set up Trivy
        uses: aquasecurity/setup-trivy@3fb12ec12f41e471780db15c232d5dd185dcb514 # v0.2.6
        with:
          version: ${{ env.TRIVY_VERSION }}
          cache: true

      - name: Scan every built image and generate image SBOMs
        run: bash scripts/scan-images.sh

      - name: Run OWASP ZAP active application scan
        run: bash scripts/run-zap.sh

      - name: Verify workspace and moderator scenarios through nginx
        working-directory: tests
        shell: bash
        env:
          COMPOSE_SMOKE_URL: http://127.0.0.1:${{ env.CI_HTTP_PORT }}
        run: |
          mkdir -p ../security-artifacts
          go test -count=1 -v -timeout 3m -run '^TestComposeWorkspace$' . 2>&1 | tee ../security-artifacts/compose-workspace.log

      - name: Save Compose diagnostics on failure
        if: failure()
        run: |
          mkdir -p security-artifacts
          docker compose ps --all | tee security-artifacts/compose-ps.log
          docker compose logs --no-color --tail=200 > security-artifacts/compose.log 2>&1

      - name: Upload container and DAST reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: container-and-zap-reports
          path: security-artifacts
          if-no-files-found: warn
          retention-days: 14

      - name: Remove CI containers and volumes
        if: always()
        run: docker compose down --volumes --remove-orphans

  deploy:
    name: Deploy to Debian VM
    needs:
      - quality
      - backend
      - frontend
      - migrations
      - contract
      - golden
      - e2e
      - dynamic
      - codeql
      - semgrep
      - supply-chain
      - dependency-track
      - container-dast
    if: >-
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: [self-hosted, linux, x64, cybercalculator-prod]
    timeout-minutes: 20
    environment: production
    concurrency:
      group: cybercalculator-production
      cancel-in-progress: false
    env:
      COMPOSE_PROJECT_NAME: cybercalculatorminc
      APP_VERSION: ${{ github.sha }}
      DB_USER: ${{ secrets.PROD_DB_USER }}
      DB_PASSWORD: ${{ secrets.PROD_DB_PASSWORD }}
      DB_NAME: ${{ secrets.PROD_DB_NAME }}
      DB_RUNTIME_USER: ${{ vars.PROD_DB_RUNTIME_USER || 'cybercalc_app' }}
      DB_RUNTIME_PASSWORD: ${{ secrets.PROD_DB_RUNTIME_PASSWORD }}
      ADMIN_BOOTSTRAP_EMAIL: ${{ secrets.PROD_ADMIN_BOOTSTRAP_EMAIL }}
      ADMIN_BOOTSTRAP_PASSWORD: ${{ secrets.PROD_ADMIN_BOOTSTRAP_PASSWORD }}
      APP_ENV: development
      MFA_ENCRYPTION_KEY: ${{ secrets.PROD_MFA_ENCRYPTION_KEY }}
      # The application is reached through the VM floating IP. Set this
      # explicitly so a stale runner/service environment cannot restrict the
      # published nginx port to 127.0.0.1 while local health checks still pass.
      HTTP_BIND: 0.0.0.0
      HTTP_PORT: ${{ vars.PROD_HTTP_PORT || '8080' }}
      BACKEND_REPLICAS: ${{ vars.PROD_BACKEND_REPLICAS || '2' }}

    steps:
      - name: Check out verified commit
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          clean: true

      - name: Validate deployment settings
        shell: bash
        run: |
          set -Eeuo pipefail
          missing=0
          [[ -n "$DB_USER" ]] || { echo "::error::GitHub production secret PROD_DB_USER is not configured"; missing=1; }
          [[ -n "$DB_PASSWORD" ]] || { echo "::error::GitHub production secret PROD_DB_PASSWORD is not configured"; missing=1; }
          [[ -n "$DB_NAME" ]] || { echo "::error::GitHub production secret PROD_DB_NAME is not configured"; missing=1; }
          [[ -n "$DB_RUNTIME_PASSWORD" ]] || { echo "::error::GitHub production secret PROD_DB_RUNTIME_PASSWORD is not configured"; missing=1; }
          [[ -n "$ADMIN_BOOTSTRAP_EMAIL" ]] || { echo "::error::GitHub production secret PROD_ADMIN_BOOTSTRAP_EMAIL is not configured"; missing=1; }
          [[ -n "$ADMIN_BOOTSTRAP_PASSWORD" ]] || { echo "::error::GitHub production secret PROD_ADMIN_BOOTSTRAP_PASSWORD is not configured"; missing=1; }
          [[ -n "$MFA_ENCRYPTION_KEY" ]] || { echo "::error::GitHub production secret PROD_MFA_ENCRYPTION_KEY is not configured"; missing=1; }
          [[ "$missing" == "0" ]]
          docker compose config --quiet

      - name: Build and deploy verified revision with Docker Compose
        run: bash scripts/deploy-safe.sh

      - name: Verify deployed application
        run: bash scripts/verify-deployment.sh

      - name: Print deployment diagnostics on failure
        if: failure()
        run: |
          docker compose ps --all
          docker compose logs --no-color --tail=200
