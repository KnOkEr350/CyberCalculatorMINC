name: CI/CD

on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * 1"

permissions:
  contents: read

env:
  GO_VERSION_FILE: backend/go.mod
  TRIVY_VERSION: v0.74.0

jobs:
  quality:
    name: Formatting and linters
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: ${{ env.GO_VERSION_FILE }}
          cache-dependency-path: |
            backend/go.sum
            tests/go.sum

      - name: Check Go formatting
        shell: bash
        run: |
          unformatted="$(gofmt -l backend tests)"
          if [[ -n "$unformatted" ]]; then
            echo "These files must be formatted with gofmt:"
            echo "$unformatted"
            exit 1
          fi

      - name: Run go vet
        shell: bash
        run: |
          (cd backend && go vet ./...)
          (cd tests && go vet ./...)

      - name: Run staticcheck
        shell: bash
        run: |
          (cd backend && go run honnef.co/go/tools/cmd/staticcheck@v0.8.1 ./...)
          (cd tests && go run honnef.co/go/tools/cmd/staticcheck@v0.8.1 ./...)

      - name: Check frontend JavaScript syntax
        shell: bash
        run: |
          node --check frontend/app.js
          node --check frontend/workspace.js
          node --check frontend/mfa.js

      - name: Lint GitHub Actions workflow
        run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.12

  tests:
    name: Unit, race and API integration tests
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16-alpine@sha256:cf78e76683b9ca8c5733cbbdce6c9262b45b6767934dd0a95e671f9a0fc20685
        env:
          POSTGRES_USER: workspace_test
          POSTGRES_PASSWORD: workspace_test
          POSTGRES_DB: workspace_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U workspace_test -d workspace_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12

    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: ${{ env.GO_VERSION_FILE }}
          cache-dependency-path: |
            backend/go.sum
            tests/go.sum

      - name: Run backend unit tests with race detector
        working-directory: backend
        run: go test -count=1 -race -covermode=atomic -coverprofile=backend-coverage.out ./...

      - name: Run API and authentication tests against PostgreSQL
        working-directory: tests
        env:
          TEST_DATABASE_DSN: host=127.0.0.1 port=5432 user=workspace_test password=workspace_test dbname=workspace_test sslmode=disable
          TEST_MIGRATIONS_DIR: ${{ github.workspace }}/migrations
        run: go test -count=1 -race -coverpkg=cybercalc/... -covermode=atomic -coverprofile=integration-coverage.out ./...

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: go-coverage
          path: |
            backend/backend-coverage.out
            tests/integration-coverage.out
          if-no-files-found: warn
          retention-days: 14

  dynamic:
    name: Fuzzing and performance profiles
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: ${{ env.GO_VERSION_FILE }}
          cache-dependency-path: |
            backend/go.sum
            tests/go.sum

      - name: Fuzz untrusted XLSX input
        working-directory: tests
        run: go test -run '^$' -fuzz '^FuzzWorkbookReader$' -fuzztime 20s ./...

      - name: Record calculator CPU and memory profiles
        working-directory: tests
        run: |
          go test -run '^$' -bench '^BenchmarkCalculateAmount$' -benchmem \
            -cpuprofile perf-cpu.pprof -memprofile perf-memory.pprof ./...
          go tool pprof -top perf-cpu.pprof > perf-cpu.txt
          go tool pprof -top perf-memory.pprof > perf-memory.txt

      - name: Upload performance profiles
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: performance-profiles
          path: |
            tests/perf-*.pprof
            tests/perf-*.txt
          retention-days: 14

  codeql:
    name: CodeQL (${{ matrix.language }})
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: read
      security-events: write
      packages: read
    strategy:
      fail-fast: false
      matrix:
        language:
          - go
          - javascript-typescript

    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Set up Go
        if: matrix.language == 'go'
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: ${{ env.GO_VERSION_FILE }}
          cache-dependency-path: backend/go.sum

      - name: Initialize CodeQL
        uses: github/codeql-action/init@311b4ee155dcdab395044f00946f664bd51ff173 # v4.38.0
        with:
          languages: ${{ matrix.language }}
          queries: security-extended

      - name: Build Go application for CodeQL
        if: matrix.language == 'go'
        working-directory: backend
        run: go build ./cmd/server

      - name: Analyze with CodeQL
        uses: github/codeql-action/analyze@311b4ee155dcdab395044f00946f664bd51ff173 # v4.38.0
        with:
          category: /language:${{ matrix.language }}

  semgrep:
    name: Semgrep SAST
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      security-events: write

    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Scan Go, JavaScript and OWASP patterns
        run: |
          mkdir -p security-artifacts
          docker run --rm \
            --volume "$PWD:/src" \
            --workdir /src \
            semgrep/semgrep:1.177.0@sha256:acaac22ffc7b7cc5926de0751b223bce0b2491c33d18422fa72f632c78d81198 \
            semgrep scan --error --metrics=off --severity ERROR \
            --config p/default --config p/owasp-top-ten \
            --sarif --output security-artifacts/semgrep.sarif .

      - name: Upload Semgrep results to code scanning
        if: >-
          always() && hashFiles('security-artifacts/semgrep.sarif') != '' &&
          (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
        uses: github/codeql-action/upload-sarif@311b4ee155dcdab395044f00946f664bd51ff173 # v4.38.0
        with:
          sarif_file: security-artifacts/semgrep.sarif
          category: semgrep

      - name: Upload Semgrep report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: semgrep-report
          path: security-artifacts/semgrep.sarif
          if-no-files-found: warn
          retention-days: 14

  supply-chain:
    name: Secrets, dependencies and SBOM
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      DTRACK_HOSTNAME: ${{ vars.DTRACK_HOSTNAME }}
      DTRACK_API_KEY: ${{ secrets.DTRACK_API_KEY }}

    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: ${{ env.GO_VERSION_FILE }}
          cache-dependency-path: |
            backend/go.sum
            tests/go.sum

      - name: Scan repository, secrets and Docker configuration
        uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret,misconfig
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
          format: table

      - name: Check Go dependencies with govulncheck
        shell: bash
        run: |
          (cd backend && go run golang.org/x/vuln/cmd/govulncheck@v1.7.0 ./...)
          (cd tests && go run golang.org/x/vuln/cmd/govulncheck@v1.7.0 ./...)

      - name: Generate CycloneDX SBOM for the shipped backend
        working-directory: backend
        env:
          CGO_ENABLED: "0"
          GOOS: linux
          GOARCH: amd64
        run: |
          mkdir -p ../security-artifacts
          go run github.com/CycloneDX/cyclonedx-gomod/cmd/cyclonedx-gomod@v1.10.0 \
            app -json -licenses -main cmd/server \
            -output ../security-artifacts/cybercalculator-backend.cdx.json .

      - name: Upload SBOM to OWASP Dependency-Track
        if: env.DTRACK_HOSTNAME != '' && env.DTRACK_API_KEY != ''
        uses: DependencyTrack/gh-upload-sbom@d8935b70f527d6aca6bbef5ab02db3933c9a8626 # v4.2.0
        with:
          server-hostname: ${{ env.DTRACK_HOSTNAME }}
          protocol: ${{ vars.DTRACK_PROTOCOL || 'https' }}
          port: ${{ vars.DTRACK_PORT || '443' }}
          api-key: ${{ env.DTRACK_API_KEY }}
          project-name: CyberCalculatorMINC
          project-version: ${{ github.sha }}
          project-tags: ci,go
          auto-create: true
          is-latest: ${{ github.ref == 'refs/heads/main' }}
          bom-filename: security-artifacts/cybercalculator-backend.cdx.json

      - name: Report missing Dependency-Track connection
        if: env.DTRACK_HOSTNAME == '' || env.DTRACK_API_KEY == ''
        run: echo "::warning::Dependency-Track upload is disabled; configure DTRACK_HOSTNAME and DTRACK_API_KEY"

      - name: Upload dependency reports and SBOM
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: dependency-security-reports
          path: security-artifacts
          if-no-files-found: warn
          retention-days: 30

  container-dast:
    name: Isolated containers and OWASP ZAP
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    needs: tests
    env:
      COMPOSE_PROJECT_NAME: cybercalc-ci-${{ github.run_id }}-${{ github.run_attempt }}
      CI_HTTP_PORT: "18080"
      APP_VERSION: ${{ github.sha }}

    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Create isolated CI configuration
        shell: bash
        run: |
          umask 077
          {
            echo "DB_USER=cybercalc_ci"
            echo "DB_PASSWORD=ci-only-password"
            echo "DB_NAME=cybercalc_ci"
            echo "HTTP_PORT=${CI_HTTP_PORT}"
            echo "BACKEND_REPLICAS=2"
            echo "ADMIN_BOOTSTRAP_EMAIL=ci-admin@example.invalid"
            echo "ADMIN_BOOTSTRAP_PASSWORD=ci-only-admin-password"
          } > .env

      - name: Validate Compose configuration
        run: docker compose config --quiet

      - name: Build and start the complete application
        run: docker compose up --detach --build --wait --wait-timeout 180

      - name: Verify isolated application boundary
        shell: bash
        run: |
          base_url="http://127.0.0.1:${CI_HTTP_PORT}"
          curl --fail --silent --show-error "${base_url}/" > /dev/null
          curl --fail --silent --show-error "${base_url}/api/health" | jq --exit-status '.status == "ok"' > /dev/null
          served_version="$(curl --fail --silent --show-error "${base_url}/version.txt" | tr -d '\r\n')"
          [[ "$served_version" == "$APP_VERSION" ]]
          anonymous_status="$(curl --silent --output /dev/null --write-out '%{http_code}' "${base_url}/api/auth/me")"
          [[ "$anonymous_status" == "401" ]]

      - name: Set up Trivy
        uses: aquasecurity/setup-trivy@3fb12ec12f41e471780db15c232d5dd185dcb514 # v0.2.6
        with:
          version: ${{ env.TRIVY_VERSION }}
          cache: true

      - name: Scan every built image and generate image SBOMs
        run: bash scripts/scan-images.sh

      - name: Run OWASP ZAP active application scan
        shell: bash
        run: |
          mkdir -p security-artifacts
          sudo chown -R 1000:1000 security-artifacts
          set +e
          docker run --rm \
            --network "${COMPOSE_PROJECT_NAME}_application" \
            --volume "$PWD/security-artifacts:/zap/wrk:rw" \
            ghcr.io/zaproxy/zaproxy:2.17.0@sha256:781a2bdaea47324e7bab583e2263f21d257b0aee61ed51521a5be45f5f5081ef \
            zap-full-scan.py -t http://nginx -m 1 -T 10 -I \
            -z "-config ascan.maxScanDurationInMins=5 -config ascan.maxRuleDurationInMins=1" \
            -J zap-report.json -r zap-report.html
          zap_status=$?
          set -e
          sudo chown -R "$(id -u):$(id -g)" security-artifacts
          [[ "$zap_status" == "0" ]]
          jq --exit-status '[.site[]?.alerts[]? | select((.riskcode | tonumber) >= 3)] | length == 0' \
            security-artifacts/zap-report.json > /dev/null

      - name: Upload container and DAST reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: container-and-zap-reports
          path: security-artifacts
          if-no-files-found: warn
          retention-days: 14

      - name: Print Compose diagnostics on failure
        if: failure()
        run: |
          docker compose ps --all
          docker compose logs --no-color --tail=200

      - name: Remove CI containers and volumes
        if: always()
        run: docker compose down --volumes --remove-orphans

  deploy:
    name: Deploy to Debian VM
    needs:
      - quality
      - tests
      - dynamic
      - codeql
      - semgrep
      - supply-chain
      - container-dast
    if: >-
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: [self-hosted, linux, x64, cybercalculator-prod]
    timeout-minutes: 20
    environment: production
    concurrency:
      group: cybercalculator-production
      cancel-in-progress: false
    env:
      COMPOSE_PROJECT_NAME: cybercalculatorminc
      APP_VERSION: ${{ github.sha }}
      DB_USER: ${{ secrets.PROD_DB_USER }}
      DB_PASSWORD: ${{ secrets.PROD_DB_PASSWORD }}
      DB_NAME: ${{ secrets.PROD_DB_NAME }}
      DB_RUNTIME_USER: ${{ vars.PROD_DB_RUNTIME_USER || 'cybercalc_app' }}
      DB_RUNTIME_PASSWORD: ${{ secrets.PROD_DB_RUNTIME_PASSWORD }}
      ADMIN_BOOTSTRAP_EMAIL: ${{ secrets.PROD_ADMIN_BOOTSTRAP_EMAIL }}
      ADMIN_BOOTSTRAP_PASSWORD: ${{ secrets.PROD_ADMIN_BOOTSTRAP_PASSWORD }}
      APP_ENV: development
      MFA_ENCRYPTION_KEY: ${{ secrets.PROD_MFA_ENCRYPTION_KEY }}
      HTTP_PORT: ${{ vars.PROD_HTTP_PORT || '8080' }}
      BACKEND_REPLICAS: ${{ vars.PROD_BACKEND_REPLICAS || '2' }}

    steps:
      - name: Check out verified commit
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          clean: true

      - name: Validate deployment settings
        shell: bash
        run: |
          set -Eeuo pipefail
          missing=0
          [[ -n "$DB_USER" ]] || { echo "::error::GitHub production secret PROD_DB_USER is not configured"; missing=1; }
          [[ -n "$DB_PASSWORD" ]] || { echo "::error::GitHub production secret PROD_DB_PASSWORD is not configured"; missing=1; }
          [[ -n "$DB_NAME" ]] || { echo "::error::GitHub production secret PROD_DB_NAME is not configured"; missing=1; }
          [[ -n "$DB_RUNTIME_PASSWORD" ]] || { echo "::error::GitHub production secret PROD_DB_RUNTIME_PASSWORD is not configured"; missing=1; }
          [[ -n "$ADMIN_BOOTSTRAP_EMAIL" ]] || { echo "::error::GitHub production secret PROD_ADMIN_BOOTSTRAP_EMAIL is not configured"; missing=1; }
          [[ -n "$ADMIN_BOOTSTRAP_PASSWORD" ]] || { echo "::error::GitHub production secret PROD_ADMIN_BOOTSTRAP_PASSWORD is not configured"; missing=1; }
          [[ -n "$MFA_ENCRYPTION_KEY" ]] || { echo "::error::GitHub production secret PROD_MFA_ENCRYPTION_KEY is not configured"; missing=1; }
          [[ "$missing" == "0" ]]
          docker compose config --quiet

      - name: Build and deploy verified revision with Docker Compose
        run: bash scripts/deploy-safe.sh

      - name: Verify deployed application
        shell: bash
        run: |
          set -Eeuo pipefail
          base_url="http://127.0.0.1:${HTTP_PORT}"
          for attempt in {1..30}; do
            frontend_status="$(curl --silent --output /dev/null --write-out '%{http_code}' "${base_url}/" || true)"
            api_status="$(curl --silent --output /dev/null --write-out '%{http_code}' "${base_url}/api/auth/me" || true)"
            served_version="$(curl --silent --fail "${base_url}/version.txt" 2>/dev/null | tr -d '\r\n' || true)"
            if [[ "$frontend_status" == "200" && "$api_status" == "401" && "$served_version" == "$APP_VERSION" ]]; then
              echo "Revision $APP_VERSION is live"
              exit 0
            fi
            sleep 2
          done
          echo "Deployment health check failed: expected revision $APP_VERSION, got ${served_version:-nothing}"
          exit 1

      - name: Print deployment diagnostics on failure
        if: failure()
        run: |
          docker compose ps --all
          docker compose logs --no-color --tail=200
