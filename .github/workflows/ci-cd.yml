name: CI/CD

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    name: Linters and security
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      - name: Check Go formatting
        working-directory: backend
        shell: bash
        run: |
          unformatted="$(gofmt -l .)"
          if [[ -n "$unformatted" ]]; then
            echo "These files must be formatted with gofmt:"
            echo "$unformatted"
            exit 1
          fi

      - name: Run go vet
        working-directory: backend
        run: go vet ./...

      - name: Run staticcheck
        working-directory: backend
        run: go run honnef.co/go/tools/cmd/staticcheck@v0.8.1 ./...

      - name: Lint GitHub Actions workflow
        run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.12

      - name: Check Go dependencies for known vulnerabilities
        working-directory: backend
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.7.0 ./...

      - name: Scan repository, secrets and Docker configuration
        uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret,misconfig
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
          format: table

  verify:
    name: Tests and Compose smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      COMPOSE_PROJECT_NAME: cybercalc-ci-${{ github.run_id }}-${{ github.run_attempt }}
      CI_HTTP_PORT: "18080"
      APP_VERSION: ${{ github.sha }}

    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      - name: Run required Go tests
        working-directory: backend
        run: go test ./...

      - name: Check frontend JavaScript syntax
        run: |
          node --check frontend/app.js
          node --check frontend/workspace.js

      - name: Create isolated CI configuration
        shell: bash
        run: |
          umask 077
          {
            echo "DB_USER=cybercalc_ci"
            echo "DB_PASSWORD=ci-only-password"
            echo "DB_NAME=cybercalc_ci"
            echo "HTTP_PORT=${CI_HTTP_PORT}"
            echo "BACKEND_REPLICAS=2"
            echo "ADMIN_BOOTSTRAP_EMAIL=ci-admin@example.invalid"
            echo "ADMIN_BOOTSTRAP_PASSWORD=ci-only-admin-password"
          } > .env

      - name: Validate Compose configuration
        run: docker compose config --quiet

      - name: Build and start the complete application
        run: docker compose up --detach --build --wait --wait-timeout 180

      - name: Verify frontend and API through nginx
        shell: bash
        run: |
          set -Eeuo pipefail
          base_url="http://127.0.0.1:${CI_HTTP_PORT}"

          for attempt in {1..30}; do
            if curl --fail --silent --show-error "${base_url}/" | grep -q "Калькулятор затрат"; then
              break
            fi
            if [[ "$attempt" == "30" ]]; then
              echo "Frontend did not become ready"
              exit 1
            fi
            sleep 2
          done

          curl --fail --silent --show-error "${base_url}/app.js" > /dev/null
          curl --fail --silent --show-error "${base_url}/style.css" > /dev/null
          served_version="$(curl --fail --silent --show-error "${base_url}/version.txt" | tr -d '\r\n')"
          [[ "$served_version" == "$APP_VERSION" ]] || {
            echo "Expected frontend $APP_VERSION, got $served_version"
            exit 1
          }

          logged_in=false
          for attempt in {1..30}; do
            if curl --fail --silent --show-error \
              --cookie-jar /tmp/cybercalc-ci-cookies \
              --header "X-Cybercalc-Request: 1" \
              --header "Content-Type: application/json" \
              --data '{"email":"ci-admin@example.invalid","password":"ci-only-admin-password"}' \
              "${base_url}/api/auth/login" > /dev/null; then
              logged_in=true
              break
            fi
            sleep 2
          done
          if [[ "$logged_in" != "true" ]]; then
            echo "Backend login did not become ready"
            exit 1
          fi

          curl --fail --silent --show-error \
            --cookie /tmp/cybercalc-ci-cookies \
            "${base_url}/api/auth/me" \
            | grep -q '"email":"ci-admin@example.invalid"'

      - name: Verify creating, editing and attaching files
        shell: bash
        run: |
          set -Eeuo pipefail
          base_url="http://127.0.0.1:${CI_HTTP_PORT}"
          cookie_file="/tmp/cybercalc-ci-cookies"

          curl --fail --silent --show-error \
            --cookie "$cookie_file" \
            --header "X-Cybercalc-Request: 1" \
            --header "Content-Type: application/json" \
            --data '{"entity_type":"organization"}' \
            "${base_url}/api/auth/entity-type" > /dev/null

          # Production forbids arbitrary partner names. Seed a verified registry
          # row into this disposable CI database, then exercise the public API.
          directory_id="$(docker compose exec -T db psql \
            --username cybercalc_ci \
            --dbname cybercalc_ci \
            --quiet \
            --tuples-only \
            --no-align \
            --set ON_ERROR_STOP=1 \
            --command "INSERT INTO education_directory(
              name,partner_kind,region,source,inn,ogrn,license_number,
              license_status,institution_status,registry_record_id,source_url,
              registry_updated_at,verified_at,verification_status,
              program_codes,programs_source_url,programs_checked_at
            ) VALUES (
              'CI test university','vuz','г. Москва','CI verified fixture',
              '7707083893','1027700132195','CI-LICENSE-1','active','active',
              'ci-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}',
              'https://islod.obrnadzor.gov.ru/rlic/details/ci-fixture',
              CURRENT_DATE,now(),'verified',ARRAY['09.03.01'],
              'https://ci.example.invalid/sveden/education/',now()
            ) RETURNING id;")"
          [[ "$directory_id" =~ ^[0-9a-f-]{36}$ ]]

          partner_response="$(curl --fail --silent --show-error \
            --cookie "$cookie_file" \
            --header "X-Cybercalc-Request: 1" \
            --header "Content-Type: application/json" \
            --data "$(jq --compact-output --null-input --arg directory "$directory_id" '{
              directory_id: $directory,
              initial_agreement: {
                partner_ids: [],
                agreement_kind: "education_organization",
                number: "CI-1",
                status: "active",
                signed_on: "2026-01-01",
                valid_from: "2020-01-01",
                valid_until: "2100-12-31",
                signature_method: "qualified_electronic",
                signed_by: "CI Signer",
                signature_date: "2026-01-01",
                document_reference: "CI smoke test",
                responsible_people: [
                  {party: "cyberprotect", full_name: "CI Administrator"},
                  {party: "counterparty", full_name: "CI Partner"}
                ]
              }
            }')" \
            "${base_url}/api/partners")"
          partner_id="$(jq --exit-status --raw-output '.id' <<< "$partner_response")"
          agreement_id="$(jq --exit-status --raw-output '.agreement_id' <<< "$partner_response")"

          entry_payload="$(jq --compact-output --null-input \
            --arg partner "$partner_id" \
            --arg agreement "$agreement_id" '{
            category_code: "teachers",
            partner_id: $partner,
            agreement_id: $agreement,
            period_type: "fact",
            report_year: 2026,
            audience: "vuz",
            payload: {
              org_name: $partner,
              course_name: "CI course",
              teacher_full_name: "CI teacher",
              employment_form: "ГПХ",
              academic_hours: 2
            }
          }')"
          printf 'created with entry\n' > /tmp/cybercalc-first-attachment.txt
          entry_response="$(curl --fail --silent --show-error \
            --cookie "$cookie_file" \
            --header "X-Cybercalc-Request: 1" \
            --header "Content-Type: application/json" \
            --data "$entry_payload" \
            "${base_url}/api/entries")"
          entry_id="$(jq --exit-status --raw-output '.id' <<< "$entry_response")"

          # Fact can be created and edited without attachments.
          curl --fail --silent --show-error \
            --cookie "$cookie_file" \
            --header "X-Cybercalc-Request: 1" \
            --form 'files=@/tmp/cybercalc-first-attachment.txt;filename=first.txt' \
            "${base_url}/api/entries/${entry_id}/attachments" > /dev/null

          update_payload="$(jq --compact-output --null-input \
            --arg partner "$partner_id" \
            --arg agreement "$agreement_id" '{
            audience: "vuz",
            agreement_id: $agreement,
            comment: "CI attachment edit check",
            payload: {
              org_name: $partner,
              course_name: "Updated CI course",
              teacher_full_name: "CI teacher",
              employment_form: "ГПХ",
              academic_hours: 3
            }
          }')"
          curl --fail --silent --show-error --request PUT \
            --cookie "$cookie_file" \
            --header "X-Cybercalc-Request: 1" \
            --header "Content-Type: application/json" \
            --data "$update_payload" \
            "${base_url}/api/entries/${entry_id}" > /dev/null

          printf 'attached after edit\n' > /tmp/cybercalc-second-attachment.txt
          curl --fail --silent --show-error \
            --cookie "$cookie_file" \
            --header "X-Cybercalc-Request: 1" \
            --form 'file=@/tmp/cybercalc-second-attachment.txt;filename=second.txt' \
            "${base_url}/api/entries/${entry_id}/attachments" > /dev/null

          attachments="$(curl --fail --silent --show-error \
            --cookie "$cookie_file" \
            "${base_url}/api/entries/${entry_id}/attachments")"
          [[ "$(jq 'length' <<< "$attachments")" == "2" ]]
          first_attachment_id="$(jq --exit-status --raw-output '.[] | select(.file_name == "first.txt") | .id' <<< "$attachments")"
          curl --fail --silent --show-error \
            --cookie "$cookie_file" \
            "${base_url}/api/attachments/${first_attachment_id}/download" \
            --output /tmp/cybercalc-downloaded-attachment.txt
          cmp /tmp/cybercalc-first-attachment.txt /tmp/cybercalc-downloaded-attachment.txt

      - name: Verify moderator boundaries and IT-company registry
        shell: bash
        run: |
          set -Eeuo pipefail
          base_url="http://127.0.0.1:${CI_HTTP_PORT}"
          admin_cookie="/tmp/cybercalc-ci-cookies"
          moderator_cookie="/tmp/cybercalc-ci-moderator-cookies"

          curl --fail --silent --show-error \
            --cookie "$admin_cookie" \
            --header "X-Cybercalc-Request: 1" \
            --header "Content-Type: application/json" \
            --data '{"email":"ci-moderator@example.invalid","password":"ModeratorPass1!","full_name":"CI Moderator","role":"moderator","entity_type":"organization"}' \
            "${base_url}/api/admin/users" > /dev/null

          curl --fail --silent --show-error \
            --cookie-jar "$moderator_cookie" \
            --header "X-Cybercalc-Request: 1" \
            --header "Content-Type: application/json" \
            --data '{"email":"ci-moderator@example.invalid","password":"ModeratorPass1!"}' \
            "${base_url}/api/auth/login" > /dev/null

          for path in admin/users admin/settings admin/logs; do
            status="$(curl --silent --output /dev/null --write-out '%{http_code}' --cookie "$moderator_cookie" "${base_url}/api/${path}")"
            [[ "$status" == "403" ]]
          done

          curl --fail --silent --show-error \
            --cookie "$moderator_cookie" \
            "${base_url}/api/admin/directory-template" \
            --output /tmp/cybercalc-directory-template.xlsx

          registry_date="$(date -u +%F)"
          curl --fail --silent --show-error \
            --cookie "$moderator_cookie" \
            --header "X-Cybercalc-Request: 1" \
            --header "Content-Type: application/json" \
            --data "$(jq --compact-output --null-input --arg date "$registry_date" '{name:"CI accredited IT company",inn:"7707083893",ogrn:"1027700132195",accreditation_number:"CI-ACCREDITATION-1",registry_record_id:"ci-it-company-1",registry_updated_at:$date,source_url:"https://digital.gov.ru/ru/activity/govservices/1/"}')" \
            "${base_url}/api/it-companies" > /dev/null

          curl --fail --silent --show-error \
            --cookie "$moderator_cookie" \
            "${base_url}/api/it-companies?q=CI%20accredited" \
            | jq --exit-status 'length == 1 and .[0].accreditation_status == "active"' > /dev/null

      - name: Print Compose diagnostics on failure
        if: failure()
        run: |
          docker compose ps --all
          docker compose logs --no-color --tail=200

      - name: Remove CI containers and volumes
        if: always()
        run: docker compose down --volumes --remove-orphans

  deploy:
    name: Deploy to Debian VM
    needs: [quality, verify]
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: [self-hosted, linux, x64, cybercalculator-prod]
    timeout-minutes: 20
    environment: production
    concurrency:
      group: cybercalculator-production
      cancel-in-progress: false
    env:
      COMPOSE_PROJECT_NAME: cybercalculatorminc
      APP_VERSION: ${{ github.sha }}
      DB_USER: ${{ secrets.PROD_DB_USER }}
      DB_PASSWORD: ${{ secrets.PROD_DB_PASSWORD }}
      DB_NAME: ${{ secrets.PROD_DB_NAME }}
      DB_RUNTIME_USER: ${{ vars.PROD_DB_RUNTIME_USER || 'cybercalc_app' }}
      DB_RUNTIME_PASSWORD: ${{ secrets.PROD_DB_RUNTIME_PASSWORD }}
      ADMIN_BOOTSTRAP_EMAIL: ${{ secrets.PROD_ADMIN_BOOTSTRAP_EMAIL }}
      ADMIN_BOOTSTRAP_PASSWORD: ${{ secrets.PROD_ADMIN_BOOTSTRAP_PASSWORD }}
      # Temporary development deployment over HTTP. Switch back to production
      # only together with a real HTTPS origin and a reachable ClamAV service.
      APP_ENV: development
      MFA_ENCRYPTION_KEY: ${{ secrets.PROD_MFA_ENCRYPTION_KEY }}
      HTTP_PORT: ${{ vars.PROD_HTTP_PORT || '8080' }}
      BACKEND_REPLICAS: ${{ vars.PROD_BACKEND_REPLICAS || '2' }}

    steps:
      - name: Check out verified commit
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          clean: true

      - name: Validate deployment settings
        shell: bash
        run: |
          set -Eeuo pipefail
          missing=0
          [[ -n "$DB_USER" ]] || { echo "::error::GitHub production secret PROD_DB_USER is not configured"; missing=1; }
          [[ -n "$DB_PASSWORD" ]] || { echo "::error::GitHub production secret PROD_DB_PASSWORD is not configured"; missing=1; }
          [[ -n "$DB_NAME" ]] || { echo "::error::GitHub production secret PROD_DB_NAME is not configured"; missing=1; }
          [[ -n "$DB_RUNTIME_PASSWORD" ]] || { echo "::error::GitHub production secret PROD_DB_RUNTIME_PASSWORD is not configured"; missing=1; }
          [[ -n "$ADMIN_BOOTSTRAP_EMAIL" ]] || { echo "::error::GitHub production secret PROD_ADMIN_BOOTSTRAP_EMAIL is not configured"; missing=1; }
          [[ -n "$ADMIN_BOOTSTRAP_PASSWORD" ]] || { echo "::error::GitHub production secret PROD_ADMIN_BOOTSTRAP_PASSWORD is not configured"; missing=1; }
          [[ -n "$MFA_ENCRYPTION_KEY" ]] || { echo "::error::GitHub production secret PROD_MFA_ENCRYPTION_KEY is not configured"; missing=1; }
          [[ "$missing" == "0" ]]
          docker compose config --quiet

      - name: Build and deploy verified revision with Docker Compose
        shell: bash
        run: |
          set -Eeuo pipefail
          echo "Deploying $APP_VERSION from $GITHUB_WORKSPACE"
          bash scripts/deploy-safe.sh

      - name: Verify deployed application
        shell: bash
        run: |
          set -Eeuo pipefail
          base_url="http://127.0.0.1:${HTTP_PORT}"

          for attempt in {1..30}; do
            frontend_status="$(curl --silent --output /dev/null --write-out '%{http_code}' "${base_url}/" || true)"
            api_status="$(curl --silent --output /dev/null --write-out '%{http_code}' "${base_url}/api/auth/me" || true)"
            served_version="$(curl --silent --fail "${base_url}/version.txt" 2>/dev/null | tr -d '\r\n' || true)"
            if [[ "$frontend_status" == "200" && "$api_status" == "401" && "$served_version" == "$APP_VERSION" ]]; then
              echo "Revision $APP_VERSION is live"
              exit 0
            fi
            sleep 2
          done

          echo "Deployment health check failed after $attempt attempts: expected revision $APP_VERSION, got ${served_version:-nothing}"
          exit 1

      - name: Print deployment diagnostics on failure
        if: failure()
        run: |
          docker compose ps --all
          docker compose logs --no-color --tail=200
