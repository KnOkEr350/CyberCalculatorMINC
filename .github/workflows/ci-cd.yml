name: CI/CD

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    name: Required linters and security
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      - name: Check Go formatting
        working-directory: backend
        shell: bash
        run: |
          unformatted="$(gofmt -l .)"
          if [[ -n "$unformatted" ]]; then
            echo "These files must be formatted with gofmt:"
            echo "$unformatted"
            exit 1
          fi

      - name: Run go vet
        working-directory: backend
        run: go vet ./...

      - name: Run staticcheck
        working-directory: backend
        run: go run honnef.co/go/tools/cmd/staticcheck@v0.8.1 ./...

      - name: Lint GitHub Actions workflow
        run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.12

      - name: Check Go dependencies for known vulnerabilities
        working-directory: backend
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.7.0 ./...

      - name: Scan repository, secrets and Docker configuration
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret,misconfig
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
          format: table

  verify:
    name: Tests and Compose smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      test-db:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: isolated-ci-database
          POSTGRES_DB: workspace_test
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U test -d workspace_test" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      COMPOSE_PROJECT_NAME: cybercalc-ci-${{ github.run_id }}-${{ github.run_attempt }}
      CI_HTTP_PORT: "18080"
      APP_VERSION: ${{ github.sha }}
      TEST_DATABASE_DSN: host=127.0.0.1 user=test password=isolated-ci-database dbname=workspace_test sslmode=disable
      TEST_MIGRATION_DATABASE_DSN: host=127.0.0.1 user=test password=isolated-ci-database dbname=workspace_migration_test sslmode=disable
      TEST_MIGRATIONS_DIR: ${{ github.workspace }}/migrations

    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      - name: Run required Go tests
        working-directory: backend
        run: |
          PGPASSWORD=isolated-ci-database psql -h 127.0.0.1 -U test -d workspace_test -v ON_ERROR_STOP=1 -c 'CREATE DATABASE workspace_migration_test'
          go test -race ./...

      - name: Check frontend JavaScript syntax
        run: |
          node --check frontend/app.js
          node --check frontend/workspace.js
          node --check frontend/mfa.js

      - name: Create isolated CI configuration
        shell: bash
        run: |
          umask 077
          {
            echo "DB_USER=cybercalc_ci"
            echo "DB_PASSWORD=ci-only-password"
            echo "DB_NAME=cybercalc_ci"
            echo "HTTP_PORT=${CI_HTTP_PORT}"
            echo "BACKEND_REPLICAS=2"
            echo "ADMIN_BOOTSTRAP_EMAIL=ci-admin@example.invalid"
            echo "ADMIN_BOOTSTRAP_PASSWORD=ci-only-admin-password"
          } > .env

      - name: Validate Compose configuration
        run: docker compose config --quiet

      - name: Build and start the complete application
        run: docker compose up --detach --build --wait --wait-timeout 180

      - name: Scan built backend image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.COMPOSE_PROJECT_NAME }}-backend:latest
          scan-type: image
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"

      - name: Scan all running images and produce SBOMs
        run: bash scripts/scan-images.sh

      - name: Verify frontend and API through nginx
        shell: bash
        run: |
          set -Eeuo pipefail
          base_url="http://127.0.0.1:${CI_HTTP_PORT}"

          for attempt in {1..30}; do
            if curl --header "X-Cybercalc-Request: 1" --fail --silent --show-error "${base_url}/" | grep -q "Калькулятор затрат"; then
              break
            fi
            if [[ "$attempt" == "30" ]]; then
              echo "Frontend did not become ready"
              exit 1
            fi
            sleep 2
          done

          curl --header "X-Cybercalc-Request: 1" --fail --silent --show-error "${base_url}/app.js" > /dev/null
          curl --header "X-Cybercalc-Request: 1" --fail --silent --show-error "${base_url}/style.css" > /dev/null
          served_version="$(curl --header "X-Cybercalc-Request: 1" --fail --silent --show-error "${base_url}/version.txt" | tr -d '\r\n')"
          [[ "$served_version" == "$APP_VERSION" ]] || {
            echo "Expected frontend $APP_VERSION, got $served_version"
            exit 1
          }

          logged_in=false
          for attempt in {1..30}; do
            if curl --header "X-Cybercalc-Request: 1" --fail --silent --show-error \
              --cookie-jar /tmp/cybercalc-ci-cookies \
              --header "Content-Type: application/json" \
              --data '{"email":"ci-admin@example.invalid","password":"ci-only-admin-password"}' \
              "${base_url}/api/auth/login" > /dev/null; then
              logged_in=true
              break
            fi
            sleep 2
          done
          if [[ "$logged_in" != "true" ]]; then
            echo "Backend login did not become ready"
            exit 1
          fi

          curl --header "X-Cybercalc-Request: 1" --fail --silent --show-error \
            --cookie /tmp/cybercalc-ci-cookies \
            "${base_url}/api/auth/me" \
            | grep -q '"email":"ci-admin@example.invalid"'

      - name: Verify creating, editing and attaching files
        shell: bash
        run: |
          set -Eeuo pipefail
          base_url="http://127.0.0.1:${CI_HTTP_PORT}"
          cookie_file="/tmp/cybercalc-ci-cookies"

          curl --header "X-Cybercalc-Request: 1" --fail --silent --show-error \
            --cookie "$cookie_file" \
            --header "Content-Type: application/json" \
            --data '{"entity_type":"organization"}' \
            "${base_url}/api/auth/entity-type" > /dev/null

          partner_response="$(curl --header "X-Cybercalc-Request: 1" --fail --silent --show-error \
            --cookie "$cookie_file" \
            --header "Content-Type: application/json" \
            --data '{"name":"CI test university","partner_kind":"vuz","agreement_number":"CI-1"}' \
            "${base_url}/api/partners")"
          partner_id="$(jq --exit-status --raw-output '.id' <<< "$partner_response")"

          entry_payload="$(jq --compact-output --null-input --arg partner "$partner_id" '{
            category_code: "teachers",
            partner_id: $partner,
            period_type: "fact",
            report_year: 2026,
            audience: "vuz",
            payload: {
              org_name: $partner,
              course_name: "CI course",
              teacher_full_name: "CI teacher",
              employment_form: "ГПХ",
              academic_hours: 2
            }
          }')"
          printf 'created with entry\n' > /tmp/cybercalc-first-attachment.txt
          entry_response="$(curl --header "X-Cybercalc-Request: 1" --fail --silent --show-error \
            --cookie "$cookie_file" \
            --header "Content-Type: application/json" \
            --data "$entry_payload" \
            "${base_url}/api/entries")"
          entry_id="$(jq --exit-status --raw-output '.id' <<< "$entry_response")"

          # Fact can be created and edited without attachments.
          curl --header "X-Cybercalc-Request: 1" --fail --silent --show-error \
            --cookie "$cookie_file" \
            --form 'files=@/tmp/cybercalc-first-attachment.txt;filename=first.txt' \
            "${base_url}/api/entries/${entry_id}/attachments" > /dev/null

          update_payload="$(jq --compact-output --null-input --arg partner "$partner_id" '{
            audience: "vuz",
            comment: "CI attachment edit check",
            payload: {
              org_name: $partner,
              course_name: "Updated CI course",
              teacher_full_name: "CI teacher",
              employment_form: "ГПХ",
              academic_hours: 3
            }
          }')"
          curl --header "X-Cybercalc-Request: 1" --fail --silent --show-error --request PUT \
            --cookie "$cookie_file" \
            --header "Content-Type: application/json" \
            --data "$update_payload" \
            "${base_url}/api/entries/${entry_id}" > /dev/null

          printf 'attached after edit\n' > /tmp/cybercalc-second-attachment.txt
          curl --header "X-Cybercalc-Request: 1" --fail --silent --show-error \
            --cookie "$cookie_file" \
            --form 'file=@/tmp/cybercalc-second-attachment.txt;filename=second.txt' \
            "${base_url}/api/entries/${entry_id}/attachments" > /dev/null

          attachments="$(curl --header "X-Cybercalc-Request: 1" --fail --silent --show-error \
            --cookie "$cookie_file" \
            "${base_url}/api/entries/${entry_id}/attachments")"
          [[ "$(jq 'length' <<< "$attachments")" == "2" ]]
          first_attachment_id="$(jq --exit-status --raw-output '.[] | select(.file_name == "first.txt") | .id' <<< "$attachments")"
          curl --header "X-Cybercalc-Request: 1" --fail --silent --show-error \
            --cookie "$cookie_file" \
            "${base_url}/api/attachments/${first_attachment_id}/download" \
            --output /tmp/cybercalc-downloaded-attachment.txt
          cmp /tmp/cybercalc-first-attachment.txt /tmp/cybercalc-downloaded-attachment.txt

      - name: Print Compose diagnostics on failure
        if: failure()
        run: |
          docker compose ps --all
          docker compose logs --no-color --tail=200

      - name: Remove CI containers and volumes
        if: always()
        run: docker compose down --volumes --remove-orphans

  deploy:
    name: Deploy to Debian VM
    needs: [quality, verify]
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: [self-hosted, linux, x64, cybercalculator-prod]
    timeout-minutes: 20
    environment: production
    concurrency:
      group: cybercalculator-production
      cancel-in-progress: false
    env:
      COMPOSE_PROJECT_NAME: cybercalculatorminc
      APP_VERSION: ${{ github.sha }}
      DB_USER: ${{ secrets.PROD_DB_USER }}
      DB_PASSWORD: ${{ secrets.PROD_DB_PASSWORD }}
      DB_RUNTIME_USER: ${{ vars.PROD_DB_RUNTIME_USER || 'cybercalc_app' }}
      DB_RUNTIME_PASSWORD: ${{ secrets.PROD_DB_RUNTIME_PASSWORD }}
      DB_NAME: ${{ secrets.PROD_DB_NAME }}
      ADMIN_BOOTSTRAP_EMAIL: ${{ secrets.PROD_ADMIN_BOOTSTRAP_EMAIL }}
      ADMIN_BOOTSTRAP_PASSWORD: ${{ secrets.PROD_ADMIN_BOOTSTRAP_PASSWORD }}
      HTTP_PORT: ${{ vars.PROD_HTTP_PORT || '8080' }}
      BACKEND_REPLICAS: ${{ vars.PROD_BACKEND_REPLICAS || '2' }}
      APP_ENV: production
      PUBLIC_URL: ${{ vars.PROD_PUBLIC_URL }}
      CLAMAV_ADDRESS: ${{ vars.PROD_CLAMAV_ADDRESS }}
      MFA_ENCRYPTION_KEY: ${{ secrets.PROD_MFA_ENCRYPTION_KEY }}

    steps:
      - name: Check out verified commit
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          clean: true

      - name: Validate production settings
        shell: bash
        run: |
          set -Eeuo pipefail
          missing=0
          [[ -n "$DB_USER" ]] || { echo "::error::GitHub production secret PROD_DB_USER is not configured"; missing=1; }
          [[ -n "$DB_PASSWORD" ]] || { echo "::error::GitHub production secret PROD_DB_PASSWORD is not configured"; missing=1; }
          [[ ${#DB_RUNTIME_PASSWORD} -ge 16 && "$DB_RUNTIME_PASSWORD" != local-only-runtime-password && "$DB_RUNTIME_USER" != "$DB_USER" ]] || { echo "::error::Configure separate strong PROD_DB_RUNTIME_PASSWORD and runtime role"; missing=1; }
          [[ -n "$DB_NAME" ]] || { echo "::error::GitHub production secret PROD_DB_NAME is not configured"; missing=1; }
          [[ -n "$ADMIN_BOOTSTRAP_EMAIL" ]] || { echo "::error::GitHub production secret PROD_ADMIN_BOOTSTRAP_EMAIL is not configured"; missing=1; }
          [[ -n "$ADMIN_BOOTSTRAP_PASSWORD" ]] || { echo "::error::GitHub production secret PROD_ADMIN_BOOTSTRAP_PASSWORD is not configured"; missing=1; }
          [[ "$PUBLIC_URL" == https://* ]] || { echo "::error::Configure PROD_PUBLIC_URL=https://domain and TLS reverse proxy"; missing=1; }
          [[ -n "$CLAMAV_ADDRESS" ]] || { echo "::error::Configure reachable PROD_CLAMAV_ADDRESS"; missing=1; }
          [[ ${#MFA_ENCRYPTION_KEY} -eq 44 ]] || { echo "::error::Configure PROD_MFA_ENCRYPTION_KEY: openssl rand -base64 32"; missing=1; }
          [[ ${#DB_PASSWORD} -ge 16 && "$DB_PASSWORD" != change_me_db_password && ${#ADMIN_BOOTSTRAP_PASSWORD} -ge 16 ]] || { echo "::error::Use unique strong production credentials (16+ characters)"; missing=1; }
          [[ "$missing" == "0" ]]
          docker compose config --quiet

      - name: Back up before applying migrations
        shell: bash
        run: bash scripts/backup.sh

      - name: Build and deploy verified revision with Docker Compose
        shell: bash
        run: |
          set -Eeuo pipefail
          echo "Deploying $APP_VERSION from $GITHUB_WORKSPACE"
          bash scripts/deploy-safe.sh

      - name: Verify deployed application
        shell: bash
        run: |
          set -Eeuo pipefail
          base_url="http://127.0.0.1:${HTTP_PORT}"

          for attempt in {1..30}; do
            frontend_status="$(curl --silent --output /dev/null --write-out '%{http_code}' "${base_url}/" || true)"
            api_status="$(curl --silent --output /dev/null --write-out '%{http_code}' "${base_url}/api/health" || true)"
            served_version="$(curl --silent --fail "${base_url}/version.txt" 2>/dev/null | tr -d '\r\n' || true)"
            if [[ "$frontend_status" == "200" && "$api_status" == "200" && "$served_version" == "$APP_VERSION" ]]; then
              echo "Revision $APP_VERSION is live"
              exit 0
            fi
            sleep 2
          done

          echo "Deployment health check failed: expected revision $APP_VERSION, got ${served_version:-nothing}"
          exit 1

      - name: Print deployment diagnostics on failure
        if: failure()
        run: |
          docker compose ps --all
          docker compose logs --no-color --tail=200
