pid /tmp/nginx.pid;
events { worker_connections 1024; }

http {
    server_tokens off;
    client_header_timeout 10s;
    client_body_timeout 90s;
    send_timeout 90s;
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=20r/s;
    limit_req_zone $binary_remote_addr zone=login_limit:1m rate=6r/m;
    limit_conn_zone $binary_remote_addr zone=connections:1m;
    limit_req_status 429;
    limit_conn_status 429;
    # Docker DNS. resolve заставляет nginx обновлять адреса после пересоздания
    # backend/frontend-контейнеров, а не продолжать ходить на старый IP с 502.
    resolver 127.0.0.11 valid=10s ipv6=off;

    upstream backend_pool {
        zone backend_pool 64k;
        least_conn;
        server backend:8080 resolve;
        keepalive 32;
    }

    upstream frontend_pool {
        zone frontend_pool 64k;
        server frontend:80 resolve;
        keepalive 8;
    }

    server {
        listen 80;
        server_name _;
        limit_conn connections 30;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header Referrer-Policy no-referrer always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; font-src 'self'; object-src 'none'; base-uri 'none'; frame-ancestors 'none'; form-action 'self'" always;

        # 1 МБ запаса нужен для служебных границ multipart поверх файла до 64 МБ.
        client_max_body_size 65m;

        location /api/ {
            limit_req zone=api_limit burst=40 nodelay;
            proxy_pass http://backend_pool;
            proxy_http_version 1.1;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Connection "";
            proxy_read_timeout 120s;
            proxy_send_timeout 90s;
        }

        location = /api/auth/login {
            client_max_body_size 8k;
            limit_req zone=login_limit burst=8 nodelay;
            proxy_pass http://backend_pool;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header Connection "";
            proxy_http_version 1.1;
        }

        location / {
            proxy_pass http://frontend_pool;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Connection "";
        }
    }
}
