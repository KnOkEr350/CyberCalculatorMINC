# Подключается только docker-compose.tls.yml (http-уровень).
# Обычные запросы по HTTP перенаправляются на HTTPS; проверки живости и
# версии остаются доступными по HTTP, чтобы healthcheck и выкладка работали.
map "$scheme:$uri" $tls_redirect {
    default 0;
    "~^http:/(?!api/(ready|health)$|version\.txt$)" 1;
}
