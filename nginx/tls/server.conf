# Подключается только docker-compose.tls.yml (уровень server): тот же сервер
# принимает и HTTPS, поэтому все правила фильтрации и ограничения из
# nginx.conf действуют без копирования. Пара берётся по указателю live: при
# продлении он переключается атомарно, а nginx подхватывает её при перезагрузке.
listen 443 ssl;
ssl_certificate     /etc/nginx/tls/live/fullchain.pem;
ssl_certificate_key /etc/nginx/tls/live/privkey.pem;
ssl_protocols TLSv1.2 TLSv1.3;
ssl_session_timeout 1h;
ssl_session_tickets off;
add_header Strict-Transport-Security "max-age=31536000" always;
if ($tls_redirect) {
    return 308 https://$host$request_uri;
}
